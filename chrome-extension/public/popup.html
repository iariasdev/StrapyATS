<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StrapyATS — CV Optimizer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      width: 360px;
      background-color: #0b0f19;
      color: #f1f5f9;
      padding: 16px;
      font-size: 13px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-badge {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
      color: white;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.4);
    }

    .brand-title {
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.3px;
      color: #ffffff;
    }

    .brand-sub {
      font-size: 10px;
      color: #94a3b8;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 600;
    }

    .badge-live {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .badge-warning {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .card {
      background: #131b2e;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 14px;
    }

    .job-title {
      font-size: 13px;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .job-company {
      font-size: 11px;
      color: #818cf8;
      margin-bottom: 8px;
    }

    .job-preview {
      font-size: 11px;
      color: #94a3b8;
      background: #090d16;
      border-radius: 6px;
      padding: 8px;
      max-height: 85px;
      overflow-y: auto;
      line-height: 1.4;
      white-space: pre-wrap;
      border: 1px solid #1e293b;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #4338ca, #6d28d9);
      box-shadow: 0 4px 18px rgba(79, 70, 229, 0.5);
    }

    .btn-secondary {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
    }

    .btn-secondary:hover {
      background: #273549;
      color: #ffffff;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 10px;
      border-top: 1px solid #1e293b;
      font-size: 10px;
      color: #64748b;
    }

    .footer a {
      color: #818cf8;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .settings-panel {
      display: none;
      margin-top: 10px;
      padding: 10px;
      background: #090d16;
      border-radius: 8px;
      border: 1px solid #1e293b;
    }

    .settings-input {
      width: 100%;
      background: #131b2e;
      border: 1px solid #334155;
      color: #f1f5f9;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 11px;
      margin-top: 4px;
      margin-bottom: 8px;
    }

    .status-msg {
      font-size: 11px;
      text-align: center;
      padding: 8px;
      margin-bottom: 10px;
      border-radius: 6px;
      display: none;
    }

    .status-success {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      display: block;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="logo-badge">🎯</div>
      <div>
        <div class="brand-title">StrapyATS</div>
        <div class="brand-sub">Powered by CierraLab</div>
      </div>
    </div>
    <span id="platformBadge" class="badge badge-warning">Detectando...</span>
  </div>

  <div id="statusAlert" class="status-msg"></div>

  <div class="card" id="jobCard">
    <div class="job-title" id="jobTitle">Buscando vacante en la pestaña activa...</div>
    <div class="job-company" id="jobCompany">—</div>
    <div class="job-preview" id="jobPreview">Abre una oferta en LinkedIn, GetOnBoard o Indeed para extraer automáticamente los requisitos.</div>
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="btnOptimize" disabled>
      <span>🚀</span>
      <span>Optimizar con StrapyATS</span>
    </button>
    <button class="btn btn-secondary" id="btnCopy" disabled>
      <span>📋</span>
      <span>Copiar Oferta Extraída</span>
    </button>
  </div>

  <div class="footer">
    <a href="#" id="toggleSettings">⚙️ Servidor</a>
    <span>v1.0.0 • @realstrapy</span>
  </div>

  <div class="settings-panel" id="settingsPanel">
    <label style="font-size: 10px; color: #94a3b8;">URL del Dashboard StrapyATS:</label>
    <input type="text" id="appUrlInput" class="settings-input" value="http://localhost:3000" placeholder="http://localhost:3000">
    <button class="btn btn-secondary" id="btnSaveSettings" style="padding: 5px 8px; font-size: 10px;">Guardar</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
